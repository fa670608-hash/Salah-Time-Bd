name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from bundle.txt
        run: |
          python3 - <<'PY'
          import os, base64, re
          text = open('bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^@@@(FILE|B64) (.+)$\n', text, flags=re.M)
          for i in range(1, len(parts), 3):
              kind, path, body = parts[i], parts[i+1].strip(), parts[i+2]
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              if kind == 'B64':
                  open(path, 'wb').write(base64.b64decode(body.strip()))
              else:
                  open(path, 'w', encoding='utf-8', newline='\n').write(body)
              print('wrote', path)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SalahTime-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SalahTime-release-apk
          path: app/build/outputs/apk/release/*.apk
